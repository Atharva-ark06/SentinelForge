name: PR Review Guard
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  pull-requests: write
jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v7
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml
  size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const files = await github.paginate(github.rest.pulls.listFiles, {owner: context.repo.owner, repo: context.repo.repo, pull_number: context.issue.number, per_page: 100});
            const changed = files.reduce((sum, file) => sum + file.additions + file.deletions, 0);
            core.info(`PR changes ${changed} lines`);
            if (changed > 400) core.warning(`Large PR: ${changed} lines changed; consider splitting into reviewable units.`);
