name: Automated PR review
on:
  pull_request:
permissions:
  contents: read
  checks: write
jobs:
  reviewdog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: reviewdog/action-setup@v1
      - run: pip install ruff
      - name: Annotate new Ruff findings
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ruff check --output-format=concise sentinelforge scripts tests/test_zero_trust.py > ruff-report.txt || true
          reviewdog -f=pep8 -name=ruff -reporter=github-pr-check -filter-mode=added -fail-level=none < ruff-report.txt
